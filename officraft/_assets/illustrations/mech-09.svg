    <line class="ink" x1="150" y1="50" x2="150" y2="20" />
    <polygon points="147,23 153,23 150,17" fill="#211F1B" />
    <text class="muted-text" x="150" y="14" font-size="7" text-anchor="middle">REUSE</text>
    <!-- Center label -->
    <text class="accent-text" x="150" y="98" font-size="9" text-anchor="middle">96%</text>
