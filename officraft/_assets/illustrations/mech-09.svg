    .hair { stroke-width: 0.5; }
    .ink-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #211F1B; stroke: none; }
    .muted-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #6F6A60; stroke: none; }
    .accent-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #F26B1F; stroke: none; font-weight: 600; }
  </style>

    <rect class="ink thin" x="2" y="2" width="316" height="196" />
    <text class="muted-text" x="10" y="18" font-size="8">FIG. 09 · TAKE-BACK</text>
    <text class="muted-text" x="306" y="18" font-size="8" text-anchor="end">14 EU countries</text>
    <!-- Circular flow diagram -->
    <circle class="ink hair" cx="150" cy="100" r="50" />
    <!-- 4 arrow stages around the circle -->
    <line class="ink" x1="100" y1="100" x2="60" y2="100" />
    <polygon points="63,97 63,103 57,100" fill="#211F1B" />
    <text class="muted-text" x="80" y="92" font-size="7" text-anchor="middle">COLLECT</text>
    <line class="ink" x1="150" y1="150" x2="150" y2="190" />
    <polygon points="147,187 153,187 150,193" fill="#211F1B" />
    <text class="muted-text" x="150" y="170" font-size="7" text-anchor="middle">REFURBISH</text>
    <line class="ink" x1="200" y1="100" x2="240" y2="100" />
    <polygon points="237,97 237,103 243,100" fill="#211F1B" />
