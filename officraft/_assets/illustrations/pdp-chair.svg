<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="OF-CHR-001 Task Chair, technical drawing">
  <style>
    .ink { stroke: #211F1B; }
    .muted { stroke: #6F6A60; }
    .accent { stroke: #F26B1F; }
    .thin { stroke-width: 0.75; }
    .hair { stroke-width: 0.5; }
    .ink-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #211F1B; stroke: none; }
    .muted-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #6F6A60; stroke: none; }
  </style>

  <!-- BLUEPRINT FRAME -->
  <rect class="ink thin" x="20" y="20" width="600" height="440" />

  <!-- CORNER TICK MARKS (blueprint registration) -->
  <g class="ink thin">
    <line x1="20" y1="40" x2="30" y2="40"/>
    <line x1="20" y1="60" x2="30" y2="60"/>
    <line x1="20" y1="80" x2="30" y2="80"/>
    <line x1="40" y1="20" x2="40" y2="30"/>
    <line x1="60" y1="20" x2="60" y2="30"/>
    <line x1="80" y1="20" x2="80" y2="30"/>
    <line x1="610" y1="40" x2="620" y2="40"/>
    <line x1="610" y1="60" x2="620" y2="60"/>
    <line x1="610" y1="80" x2="620" y2="80"/>
    <line x1="560" y1="20" x2="560" y2="30"/>
    <line x1="580" y1="20" x2="580" y2="30"/>
    <line x1="540" y1="20" x2="540" y2="30"/>
  </g>

  <!-- TITLE BLOCK (bottom right, like a real engineering drawing) -->
  <g transform="translate(420, 380)">
    <rect class="ink thin" x="0" y="0" width="180" height="60" />
    <line class="ink hair" x1="0" y1="20" x2="180" y2="20" />
    <line class="ink hair" x1="0" y1="40" x2="180" y2="40" />
    <line class="ink hair" x1="100" y1="0" x2="100" y2="60" />
    <text class="muted-text" x="6" y="14" font-size="9">FIG.</text>
    <text class="ink-text" x="106" y="14" font-size="10" font-weight="500">01 / 04</text>
    <text class="muted-text" x="6" y="34" font-size="9">DRAWN BY</text>
    <text class="ink-text" x="106" y="34" font-size="10">OFFICRAFT</text>
    <text class="muted-text" x="6" y="54" font-size="9">SCALE</text>
    <text class="ink-text" x="106" y="54" font-size="10">1 : 8</text>
  </g>

  <!-- CHAIR — main body. Coords roughly centered around x=240, y=240 -->
  <g transform="translate(120, 40)">

    <!-- BACKREST — mesh, with internal mesh texture -->
    <rect class="ink" x="60" y="40" width="120" height="160" rx="6" />
    <!-- Mesh interior lines (backrest) -->
    <g class="ink hair">
      <line x1="60"  y1="60"  x2="180" y2="60"  />
      <line x1="60"  y1="80"  x2="180" y2="80"  />
      <line x1="60"  y1="100" x2="180" y2="100" />
      <line x1="60"  y1="120" x2="180" y2="120" />
      <line x1="60"  y1="140" x2="180" y2="140" />
      <line x1="60"  y1="160" x2="180" y2="160" />
      <line x1="60"  y1="180" x2="180" y2="180" />
      <line x1="80"  y1="40"  x2="80"  y2="200" />
      <line x1="100" y1="40"  x2="100" y2="200" />
      <line x1="120" y1="40"  x2="120" y2="200" />
      <line x1="140" y1="40"  x2="140" y2="200" />
      <line x1="160" y1="40"  x2="160" y2="200" />
    </g>

    <!-- LUMBAR SUPPORT — accent highlight -->
    <path class="accent" d="M70 130 Q 120 142, 170 130" stroke-width="2.5" />
    <text class="ink-text" x="200" y="135" font-size="9">LUMBAR CURVE</text>
    <text class="muted-text" x="200" y="148" font-size="8">18 mm give · elastomer frame</text>
    <line class="accent thin" x1="170" y1="135" x2="198" y2="135" />

    <!-- ARMRESTS — 4D adjustable, with axis indicators -->
    <!-- Left armrest -->
    <g>
      <rect class="ink" x="20" y="120" width="36" height="14" rx="3" />
      <line class="muted hair" x1="38" y1="120" x2="38" y2="240" stroke-dasharray="2,3" />
      <!-- Axis arrow indicators (4D motion) -->
      <g class="muted thin" stroke-width="1.2">
        <line x1="38" y1="155" x2="38" y2="165" />
        <polygon points="35,162 41,162 38,168" fill="#6F6A60" />
        <polygon points="35,158 41,158 38,152" fill="#6F6A60" />
      </g>
    </g>
    <!-- Right armrest -->
    <g>
      <rect class="ink" x="184" y="120" width="36" height="14" rx="3" />
      <line class="muted hair" x1="202" y1="120" x2="202" y2="240" stroke-dasharray="2,3" />
    </g>

    <!-- SEAT CUSHION — with cross-section hatching -->
    <rect class="ink" x="50" y="208" width="140" height="22" rx="4" />
    <!-- Hatching (cross-section) -->
    <g class="ink hair">
      <line x1="50" y1="214" x2="190" y2="214" />
      <line x1="50" y1="218" x2="190" y2="218" />
      <line x1="50" y1="222" x2="190" y2="222" />
      <line x1="50" y1="226" x2="190" y2="226" />
    </g>

    <!-- GAS LIFT cylinder -->
    <line class="ink" x1="120" y1="230" x2="120" y2="290" />
    <rect class="ink" x="112" y="288" width="16" height="6" />

    <!-- 5-STAR BASE -->
    <g class="ink">
      <line x1="120" y1="294" x2="40" y2="338" />
      <line x1="120" y1="294" x2="200" y2="338" />
      <line x1="120" y1="294" x2="80" y2="354" />
      <line x1="120" y1="294" x2="160" y2="354" />
      <line x1="120" y1="294" x2="120" y2="358" />
    </g>
    <!-- Castors -->
    <g class="ink">
      <circle cx="40" cy="338" r="6" fill="#F8F6F2" />
      <circle cx="200" cy="338" r="6" fill="#F8F6F2" />
      <circle cx="80" cy="354" r="6" fill="#F8F6F2" />
      <circle cx="160" cy="354" r="6" fill="#F8F6F2" />
      <circle cx="120" cy="358" r="6" fill="#F8F6F2" />
    </g>

    <!-- DIMENSION CALLOUT 1: Seat height (left side, vertical) -->
    <g class="muted">
      <!-- Extension lines -->
      <line class="hair" x1="-30" y1="208" x2="50" y2="208" />
      <line class="hair" x1="-30" y1="294" x2="40" y2="294" />
      <!-- Dimension line with arrows -->
      <line class="thin" x1="-15" y1="208" x2="-15" y2="294" />
      <polygon points="-18,212 -12,212 -15,206" fill="#6F6A60" />
      <polygon points="-18,290 -12,290 -15,296" fill="#6F6A60" />
      <g transform="translate(-60, 251) rotate(-90)">
        <text class="muted-text" x="0" y="0" font-size="9" text-anchor="start">SEAT HEIGHT</text>
        <text class="muted-text" x="0" y="11" font-size="8" text-anchor="start">440 — 560 mm</text>
      </g>
    </g>

    <!-- DIMENSION CALLOUT 2: Backrest height (right side, vertical) -->
    <g class="muted">
      <line class="hair" x1="225" y1="40" x2="180" y2="40" />
      <line class="hair" x1="225" y1="200" x2="190" y2="200" />
      <line class="thin" x1="245" y1="40" x2="245" y2="200" />
      <polygon points="242,44 248,44 245,38" fill="#6F6A60" />
      <polygon points="242,196 248,196 245,202" fill="#6F6A60" />
      <g transform="translate(258, 120) rotate(90)">
        <text class="muted-text" x="0" y="0" font-size="9" text-anchor="start">BACKREST 620 mm</text>
      </g>
    </g>

    <!-- DIMENSION CALLOUT 3: Base diameter (bottom, horizontal) -->
    <g class="muted">
      <line class="hair" x1="40" y1="370" x2="40" y2="338" />
      <line class="hair" x1="200" y1="370" x2="200" y2="338" />
      <line class="thin" x1="40" y1="365" x2="200" y2="365" />
      <polygon points="46,362 46,368 40,365" fill="#6F6A60" />
      <polygon points="194,362 194,368 200,365" fill="#6F6A60" />
      <text class="muted-text" x="100" y="382" font-size="9">BASE Ø 680 mm</text>
    </g>

    <!-- EXPLODED CALLOUT — mesh tension indicator -->
    <g>
      <line class="accent thin" x1="120" y1="100" x2="280" y2="80" />
      <circle class="accent" cx="120" cy="100" r="2.5" fill="#F26B1F" />
      <g transform="translate(280, 60)">
        <rect class="ink thin" x="0" y="0" width="100" height="40" fill="#F8F6F2" />
        <line class="ink hair" x1="0" y1="14" x2="100" y2="14" />
        <text class="muted-text" x="4" y="11" font-size="7">DETAIL · A</text>
        <text class="ink-text" x="4" y="24" font-size="8">MESH TENSION</text>
        <text class="muted-text" x="4" y="34" font-size="7">60% recycled PES</text>
      </g>
    </g>

  </g>

</svg>