<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Mechanic 06 illustration">
  <style>
    .ink { stroke: #211F1B; }
    .muted { stroke: #6F6A60; }
    .accent { stroke: #F26B1F; }
    .thin { stroke-width: 0.75; }
    .hair { stroke-width: 0.5; }
    .ink-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #211F1B; stroke: none; }
    .muted-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #6F6A60; stroke: none; }
    .accent-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #F26B1F; stroke: none; font-weight: 600; }
  </style>

    <rect class="ink thin" x="2" y="2" width="316" height="196" />
    <text class="muted-text" x="10" y="18" font-size="8">FIG. 06 · FREIGHT</text>
    <text class="muted-text" x="306" y="18" font-size="8" text-anchor="end">1 line item</text>
    <!-- Pallet / truck outline -->
    <rect class="ink" x="60" y="70" width="180" height="80" />
    <line class="ink" x1="60"  y1="120" x2="240" y2="120" />
    <!-- 4 boxes inside -->
    <rect class="muted hair" x="70" y="80" width="32" height="32" />
    <rect class="muted hair" x="110" y="80" width="32" height="32" />
    <rect class="muted hair" x="150" y="80" width="32" height="32" />
    <rect class="muted hair" x="190" y="80" width="40" height="32" />
    <!-- Wheels -->
    <circle class="ink hair" cx="80" cy="160" r="6" fill="#F8F6F2" />
    <circle class="ink hair" cx="220" cy="160" r="6" fill="#F8F6F2" />
    <!-- Annotation arrow -->
    <line class="accent thin" x1="150" y1="60" x2="150" y2="76" />
    <polygon points="147,75 153,75 150,81" fill="#F26B1F" />
    <text class="accent-text" x="150" y="56" font-size="8" text-anchor="middle">ONE FREIGHT LINE</text>
    <text class="ink-text" x="10" y="178" font-size="9">cross-category</text>
    <text class="muted-text" x="10" y="190" font-size="7">chairs + servers + cabling + LLM</text>
  
</svg>